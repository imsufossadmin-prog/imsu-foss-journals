name: Supabase & Platform Keep-Alive Cron

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Health Check & Database Keep-Alive
    runs-on: ubuntu-latest
    steps:
      - name: Ping Application Health Check & Database Keep-Alive
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || secrets.APP_URL || 'https://imsu-foss-journals.vercel.app' }}
        run: |
          echo "Executing scheduled keep-alive ping at $(date -u +'%Y-%m-%dT%H:%M:%SZ')..."

          # Clean app URL (strip trailing slashes)
          CLEAN_APP_URL=$(echo "$APP_URL" | sed 's:/*$::')

          # Ensure protocol is present
          if [[ ! "$CLEAN_APP_URL" =~ ^https?:// ]]; then
            CLEAN_APP_URL="https://$CLEAN_APP_URL"
          fi

          HEALTH_ENDPOINT="${CLEAN_APP_URL}/api/health"
          echo "Target Health Endpoint: $HEALTH_ENDPOINT"

          # Perform curl request with headers to bypass edge caching
          HTTP_RESPONSE=$(curl -s -S -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" \
            -H "User-Agent: GitHub-Actions-Keep-Alive/1.0" \
            -H "Cache-Control: no-cache" \
            "$HEALTH_ENDPOINT" || true)

          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '/HTTP_STATUS:/,$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tr -d '\r' | sed -n -e 's/^HTTP_STATUS://p')
          TIME_TOTAL=$(echo "$HTTP_RESPONSE" | tr -d '\r' | sed -n -e 's/^TIME_TOTAL://p')

          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          echo "Total Response Time: $TIME_TOTAL"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Health check and database keep-alive successful!"
          else
            echo "❌ Health check failed with status: $HTTP_STATUS"
            exit 1
          fi
